name: Nightly database backup

# 03:00 Nairobi (00:00 UTC) every night, or run by hand from the Actions tab.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 17 client (matches Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" && test -n "$BACKUP_PASSPHRASE"
          STAMP=$(TZ=Africa/Nairobi date +%Y-%m-%d_%H%M)
          # The shop's data (public schema) plus the login accounts it refers to.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --schema=public --file=kenfri.dump
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --data-only --table=auth.users --table=auth.identities --file=kenfri-auth.dump
          tar -cf "kenfri-backup-$STAMP.tar" kenfri.dump kenfri-auth.dump
          # Never store an unencrypted copy: customer phone numbers are personal data.
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
            --output "kenfri-backup-$STAMP.tar.gpg" "kenfri-backup-$STAMP.tar"
          shred -u kenfri.dump kenfri-auth.dump "kenfri-backup-$STAMP.tar"
          ls -la kenfri-backup-*.tar.gpg
          echo "FILE=kenfri-backup-$STAMP.tar.gpg" >> "$GITHUB_ENV"

      - name: Keep for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
